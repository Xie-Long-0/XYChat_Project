name: CMake

# 交付前机器门禁：configure / build / ctest 全绿才可合并。
# 该工作流原于 M0 交付，2026-08-03（31622df）被误删，导致其后 5 周内
# "ctest 6/6" 等验收结论只能靠本地手工运行，2026-09-09 周度审查后重建。
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 依赖说明：OpenSSL / QWindowKit / zlib 均已随仓库提交在 3rdparty/
      # （顶层 CMakeLists 已把 3rdparty 加入 CMAKE_PREFIX_PATH，
      #  xychat_copy_runtime_dlls 只拷贝这批 DLL，故 CI 不需要额外装它们），
      # 因此 CI 只需额外准备 Qt 6.8.3（与本地开发环境一致）。
      #
      # modules 必须显式列出 add-on 模块：安装器的默认包只含 qtbase 与
      # qtdeclarative/qtquickcontrols2（故 Core/Network/Sql/Test/Gui/Quick/
      # QuickControls2/Widgets 无需声明），而 Multimedia、HttpServer、WebSockets
      # 属于独立 add-on 模块，不在默认包内——漏配即报
      # "Failed to find required Qt component Multimedia"（Qt6_FOUND=FALSE）。
      # 依赖关系：项目用到 Multimedia（客户端元数据提取/播放器 + 测试）与
      # HttpServer（服务端数据面 + 测试），而 Qt6HttpServer 的 CMake 包又
      # find_dependency 了 Qt6WebSockets，故三者一并显式列出，不依赖安装器的
      # 模块依赖自动解析（缺任一都会在 configure 阶段 FATAL_ERROR）。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          # 显式固定 ABI，避免 runner 镜像默认值变化导致装到不匹配的 Qt 构建
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qthttpserver qtwebsockets'
          # 缓存 Qt 安装：命中时跳过下载解压（环境变量与构建工具仍会每次设置）
          # key 由 host/target/arch/version/dir/modules 等输入拼接，故日后增删
          # modules 会自动失效重下，不会复用缺模块的旧缓存
          cache: true

      - name: Configure
        run: cmake -S . -B build -DXYCHAT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Qt Test 的输出经 ctest 转发后可能为空，失败时补传原始日志便于定位
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-last-test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
